<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | LF Uniformes</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
  <style>
/* LF Uniformes — estilos base
   Paleta da marca (logo): azul-marinho #051129 e dourado #C0AC67 */
:root {
  --marinho: #051129;
  --marinho-2: #12234a;
  --papel: #eef1f4;
  --branco: #ffffff;
  --fita: #c0ac67;
  --fita-escuro: #8f7c3e;
  --tinta: #1a2233;
  --tinta-2: #55607a;
  --linha: #d5dbe3;
  --fonte: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --larg: 1160px;
  --raio: 6px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  font-family: var(--fonte);
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--tinta);
  background: var(--branco);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; height: auto; display: block; }
a { color: inherit; }
h1, h2, h3 { font-stretch: 82%; line-height: 1.08; margin: 0 0 .5em; letter-spacing: -0.01em; }
h1 { font-size: clamp(2.3rem, 4.6vw, 3.6rem); font-weight: 750; }
h2 { font-size: clamp(1.85rem, 3.4vw, 2.75rem); font-weight: 720; }
h3 { font-size: 1.25rem; font-weight: 680; font-stretch: 90%; }
p { margin: 0 0 1em; max-width: 62ch; }

:focus-visible { outline: 3px solid var(--fita); outline-offset: 3px; border-radius: 2px; }

.skip { position: absolute; left: -999px; top: 8px; background: var(--fita); color: var(--marinho); padding: 8px 14px; z-index: 100; }
.skip:focus { left: 8px; }

/* Botões e links */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 48px; padding: 12px 22px;
  background: var(--marinho); color: var(--branco);
  border: 2px solid var(--marinho); border-radius: var(--raio);
  font: inherit; font-weight: 650; font-size: 1rem; text-decoration: none; cursor: pointer;
  transition: background .15s, color .15s;
}
.btn:hover { background: var(--marinho-2); border-color: var(--marinho-2); }
.btn--sm { min-height: 40px; padding: 8px 16px; font-size: .95rem; }
.btn--linha { background: transparent; color: var(--marinho); }
.btn--linha:hover { background: var(--marinho); color: var(--branco); }
.btn--claro { background: var(--branco); color: var(--marinho); border-color: var(--branco); }
.btn--claro:hover { background: var(--fita); border-color: var(--fita); }
.btn--linha-clara { background: transparent; color: var(--branco); border-color: rgba(255,255,255,.6); }
.btn--linha-clara:hover { border-color: var(--branco); background: rgba(255,255,255,.08); }
.link { font-weight: 650; text-underline-offset: 4px; text-decoration-thickness: 2px; text-decoration-color: var(--fita-escuro); }
.link:hover { text-decoration-color: currentColor; }

/* Topo */
.topo { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--linha); backdrop-filter: blur(6px); }
.topo__in { max-width: var(--larg); margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.marca { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--marinho); }
.marca img { height: 52px; width: 52px; }
.marca__nome { display: flex; flex-direction: column; line-height: 1.05; }
.marca__nome strong { font-size: 1.2rem; font-weight: 750; font-stretch: 85%; }
.marca__nome span { font-size: .78rem; font-weight: 600; color: var(--fita-escuro); letter-spacing: .02em; }
.rodape__logo { height: 64px; width: 64px; margin-bottom: 12px; }
.nav { display: flex; align-items: center; gap: 26px; }
.nav a:not(.btn) { text-decoration: none; font-weight: 550; font-size: .98rem; color: var(--tinta); }
.nav a:not(.btn):hover { text-decoration: underline; text-decoration-color: var(--fita); text-decoration-thickness: 2px; text-underline-offset: 6px; }
.menu-btn { display: none; font: inherit; font-weight: 650; background: none; border: 2px solid var(--marinho); color: var(--marinho); border-radius: var(--raio); padding: 6px 14px; cursor: pointer; }

/* Hero */
.hero {
  max-width: var(--larg); margin: 0 auto; padding: 64px 24px 72px;
  display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: center;
}
.hero__local { font-weight: 600; color: var(--tinta-2); margin-bottom: 14px; }
.hero__sub { font-size: 1.2rem; color: var(--tinta-2); max-width: 52ch; }
.hero__ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.hero__img { margin: 0; position: relative; }
.hero__img img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: var(--raio); background: var(--papel); }

/* Etiqueta de roupa pendurada na foto */
.etiqueta {
  position: absolute; left: -28px; bottom: 36px;
  background: var(--branco); color: var(--marinho);
  font-weight: 650; font-size: .95rem; line-height: 1.3;
  padding: 14px 18px 14px 40px; max-width: 230px;
  border-radius: 4px 14px 14px 4px;
  box-shadow: 0 10px 24px -12px rgba(19,35,63,.45);
  transform: rotate(-3deg);
}
.etiqueta__furo { position: absolute; left: 14px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; border: 2px solid var(--marinho); background: var(--papel); }

/* Fita métrica: o elemento marcante da página */
.fita { background: var(--fita); color: var(--marinho); position: relative; overflow: hidden; }
.fita__regua {
  height: 22px;
  background:
    repeating-linear-gradient(90deg, var(--marinho) 0 2px, transparent 2px 60px),
    repeating-linear-gradient(90deg, var(--marinho) 0 1px, transparent 1px 12px);
  background-size: 100% 22px, 100% 11px;
  background-repeat: repeat-x;
  opacity: .85;
}
.fita__dados { max-width: var(--larg); margin: 0 auto; padding: 18px 24px 30px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.fita__dados div { display: flex; flex-direction: column-reverse; border-left: 2px solid var(--marinho); padding-left: 16px; }
.fita__dados dd { margin: 0; font-size: clamp(2.2rem, 4.5vw, 3.4rem); font-weight: 800; font-stretch: 75%; line-height: 1; font-variant-numeric: tabular-nums; }
.fita__dados dt { font-weight: 600; margin-top: 6px; }

/* Seções */
.secao { max-width: var(--larg); margin: 0 auto; padding: 96px 24px; }
.secao--escura, .secao--clara { max-width: none; }
.secao--escura { background: var(--marinho); color: var(--branco); }
.secao--clara { background: var(--papel); }
.secao--escura > *, .secao--clara > * { max-width: calc(var(--larg) - 48px); margin-left: auto; margin-right: auto; }
.secao__cab { margin-bottom: 48px; }
.secao__cab p { font-size: 1.15rem; color: var(--tinta-2); }
.secao__acao { margin-top: 36px; }

/* Linhas de produto */
.linhas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.linha img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: var(--raio); background: var(--papel); margin-bottom: 20px; }
.linha > p { color: var(--tinta-2); }
.pecas { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; }
.pecas li { font-size: .9rem; padding: 4px 10px; border: 1px solid var(--linha); border-radius: 999px; }

/* Segmentos */
.segmentos { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; }
.segmentos p { color: #c6cfdd; font-size: 1.15rem; }
.segmentos__lista { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 32px; }
.segmentos__lista li { break-inside: avoid; padding: 14px 0; border-bottom: 1px dashed rgba(255,255,255,.35); font-size: 1.15rem; font-weight: 600; }

/* Processo: costura tracejada ligando as etapas */
.costura { list-style: none; counter-reset: etapa; padding: 0; margin: 0 0 80px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; position: relative; }
.costura::before { content: ""; position: absolute; left: 20px; right: 20px; top: 20px; border-top: 2px dashed var(--marinho); opacity: .45; }
.costura li { counter-increment: etapa; position: relative; padding-top: 60px; }
.costura li::before {
  content: counter(etapa);
  position: absolute; top: 0; left: 0; width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--branco); border: 2px solid var(--marinho); color: var(--marinho);
  font-weight: 750; font-variant-numeric: tabular-nums;
}
.costura li:last-child::before { background: var(--fita); }
.costura p { font-size: .98rem; color: var(--tinta-2); }

.diferenciais { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 2px solid var(--marinho); }
.diferenciais > div { padding: 24px 24px 8px 0; }
.diferenciais > div + div { padding-left: 24px; border-left: 1px solid var(--linha); }
.diferenciais p { color: var(--tinta-2); font-size: .98rem; }

/* Clientes */
.logos { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.logos li { background: var(--branco); border-radius: var(--raio); min-height: 76px; display: grid; place-items: center; padding: 14px; font-weight: 700; font-stretch: 85%; font-size: 1.1rem; color: var(--marinho); text-align: center; }

/* Sobre */
.sobre { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
.sobre img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--raio); background: var(--papel); }

/* FAQ */
.faq details { max-width: 820px; }
.faq details { border-bottom: 1px solid var(--linha); }
.faq summary { cursor: pointer; list-style: none; padding: 20px 40px 20px 0; font-weight: 650; font-size: 1.1rem; position: relative; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; position: absolute; right: 4px; top: 14px; font-size: 1.6rem; font-weight: 400; color: var(--marinho); }
.faq details[open] summary::after { content: "–"; }
.faq details p { color: var(--tinta-2); padding-bottom: 12px; }

/* Contato / orçamento */
.contato { display: grid; grid-template-columns: .9fr 1.1fr; gap: 64px; align-items: start; }
.contato > div > p { color: #c6cfdd; font-size: 1.15rem; }
.contato__dados { list-style: none; padding: 0; margin: 28px 0 0; }
.contato__dados li { padding: 10px 0; border-top: 1px dashed rgba(255,255,255,.3); }
.contato__dados a { font-weight: 600; text-decoration-color: var(--fita); text-underline-offset: 4px; }

.form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; background: var(--marinho-2); padding: 32px; border-radius: var(--raio); }
.campo { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; }
.campo--meia { grid-column: span 1; }
.campo label, .campo legend { font-weight: 600; font-size: .95rem; }
.campo legend { margin-bottom: 6px; }
.form input:not([type=checkbox]), .form select, .form textarea {
  font: inherit; color: var(--tinta); background: var(--branco);
  border: 2px solid transparent; border-radius: 4px; padding: 10px 12px; min-height: 46px;
}
.form input:focus, .form select:focus, .form textarea:focus { outline: none; border-color: var(--fita); }
.check { display: inline-flex; align-items: center; gap: 8px; font-weight: 500 !important; margin-right: 18px; }
.check input { width: 18px; height: 18px; accent-color: var(--fita); }
.form__erro { grid-column: 1 / -1; margin: 0; color: #ffd58a; font-weight: 600; }
.form__acoes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }

/* Rodapé */
.rodape { background: #030a1a; color: #c6cfdd; padding: 56px 24px 28px; font-size: .95rem; }
.rodape__in { max-width: calc(var(--larg) - 48px); margin: 0 auto; display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 40px; }
.rodape address { font-style: normal; line-height: 1.8; }
.rodape nav { display: flex; flex-direction: column; gap: 8px; }
.rodape a { color: #e6ebf2; text-underline-offset: 3px; }
.rodape__fim { max-width: calc(var(--larg) - 48px); margin: 40px auto 0; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.12); font-size: .85rem; }

/* WhatsApp flutuante */
.wa-flutuante { position: fixed; right: 20px; bottom: 20px; z-index: 60; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: #1fa855; color: #fff; box-shadow: 0 8px 20px -6px rgba(0,0,0,.35); }
.wa-flutuante:hover { background: #178a45; }

/* Imagem ausente (antes de copiar /public/images): mantém o espaço sem quebrar o layout */
img.sem-img { visibility: hidden; }

/* Responsivo */
@media (max-width: 980px) {
  .hero, .segmentos, .sobre, .contato { grid-template-columns: 1fr; gap: 40px; }
  .hero { padding-top: 40px; }
  .etiqueta { left: 12px; }
  .linhas { grid-template-columns: 1fr 1fr; }
  .costura { grid-template-columns: 1fr; gap: 0; }
  .costura::before { left: 20px; right: auto; top: 20px; bottom: 20px; border-top: 0; border-left: 2px dashed var(--marinho); }
  .costura li { padding: 0 0 28px 64px; }
  .diferenciais { grid-template-columns: 1fr 1fr; }
  .diferenciais > div:nth-child(3) { border-left: 0; padding-left: 0; }
  .logos { grid-template-columns: repeat(4, 1fr); }
  .fita__dados { grid-template-columns: 1fr 1fr; }
  .rodape__in { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .marca img { height: 44px; width: 44px; }
  .menu-btn { display: inline-block; }
  .nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--branco); flex-direction: column; align-items: stretch; gap: 0; padding: 8px 24px 20px; border-bottom: 1px solid var(--linha); }
  .nav.aberto { display: flex; }
  .nav a:not(.btn) { padding: 12px 0; border-bottom: 1px solid var(--linha); }
  .nav .btn { margin-top: 14px; }
  .secao { padding: 64px 20px; }
  .linhas { grid-template-columns: 1fr; }
  .segmentos__lista { columns: 1; }
  .diferenciais { grid-template-columns: 1fr; }
  .diferenciais > div, .diferenciais > div + div { border-left: 0; padding-left: 0; border-bottom: 1px solid var(--linha); }
  .logos { grid-template-columns: repeat(3, 1fr); }
  .form { grid-template-columns: 1fr; padding: 22px; }
  .campo--meia { grid-column: 1 / -1; }
  .rodape__in { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
  <main class="secao">
    <h1>Esta página não existe mais</h1>
    <p>O endereço pode ter mudado com o novo site. Volte para a página inicial ou fale direto com um consultor.</p>
    <p style="display:flex;gap:12px;flex-wrap:wrap">
      <a class="btn" href="/">Ir para a página inicial</a>
      <a class="btn btn--linha" href="https://wa.me/5541991697834?text=Oi%2C%20vim%20pelo%20site!%20Gostaria%20de%20solicitar%20um%20or%C3%A7amento.">Falar no WhatsApp</a>
    </p>
  </main>
</body>
</html>
